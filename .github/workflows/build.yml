name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: pwsh tool/fetch_core.ps1
      - run: |
          $env:XRAY_BIN = "$PWD\core\xray.exe"
          flutter test
      - run: flutter build windows --release
      - name: Installer
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String '^version:\s*([^+]+)' pubspec.yaml).Matches[0].Groups[1].Value
          iscc /DAppVersion=$v windows\installer\sharrow.iss
          Compress-Archive build\windows\x64\runner\Release\* dist\Sharrow-$v-windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev libnotify-dev rpm libfuse2
      - run: flutter pub get
      - run: bash tool/fetch_core.sh linux 64
      - run: flutter build linux --release
      - run: bash tool/package_linux.sh x64
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - name: LibXray.xcframework + geo files
        run: bash tool/fetch_core.sh ios
      - name: PacketTunnel extension target
        run: |
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj
          ruby tool/ios_add_tunnel.rb
      - run: flutter build ios --release --no-codesign
      - name: Unsigned IPA
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          app=build/ios/iphoneos/Runner.app
          ext="$app/PlugIns/PacketTunnel.appex"
          # Ad-hoc signature keeps the Network Extension entitlement, which is what
          # makes iOS show the system "Add VPN Configurations" alert.
          codesign --force --sign - --timestamp=none --entitlements ios/Runner/Runner.entitlements "$app"
          if [ -d "$ext" ]; then
            codesign --force --sign - --timestamp=none --entitlements ios/PacketTunnel/PacketTunnel.entitlements "$ext"
            codesign -d --entitlements :- "$ext" | grep -q packet-tunnel-provider
          fi
          codesign -d --entitlements :- "$app" | grep -q packet-tunnel-provider
          mkdir -p Payload dist
          cp -R "$app" Payload/
          zip -qr "dist/Sharrow-$v-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: dist/*.ipa }

  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: bash tool/fetch_core.sh android
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with: { name: android, path: build/app/outputs/flutter-apk/*.apk }
